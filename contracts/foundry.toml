[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@uniswap/v2-periphery/=lib/v2-periphery/",
  "@uniswap/v2-core/=lib/v2-core/",
]

[rpc_endpoints]
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"
bsc = "https://bsc-dataseed.bnbchain.org"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api", chain = 97 }
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
